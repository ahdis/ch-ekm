<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, Helvetica, sans-serif">
  <title>Two implementation paths to the CH EKM FHIR Document</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3B73AA"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2B5081"/>
    </marker>
    <marker id="arr-grey" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7392C3"/>
    </marker>
    <filter id="sh" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#3D4960">Two ways to produce the CH EKM FHIR Document</text>

  <!-- ============================================================ -->
  <!-- LEFT: EHR -->
  <!-- ============================================================ -->
  <rect x="20" y="72" width="135" height="230" rx="8" fill="#F4F5F8" stroke="#B9C8E1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="87" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B5081">EHR</text>
  <text x="87" y="117" text-anchor="middle" font-size="8.5" fill="#555555">hospital or</text>
  <text x="87" y="128" text-anchor="middle" font-size="8.5" fill="#555555">practice software</text>
  <line x1="32" y1="136" x2="143" y2="136" stroke="#B9C8E1" stroke-width="1"/>
  <text x="87" y="156" text-anchor="middle" font-size="9.5" fill="#555555">Patient</text>
  <text x="87" y="172" text-anchor="middle" font-size="9.5" fill="#555555">Diagnoses, findings</text>
  <text x="87" y="188" text-anchor="middle" font-size="9.5" fill="#555555">Hospitalisation</text>
  <text x="87" y="204" text-anchor="middle" font-size="9.5" fill="#555555">Vaccinations</text>
  <text x="87" y="220" text-anchor="middle" font-size="9.5" fill="#555555">Treating physician,</text>
  <text x="87" y="234" text-anchor="middle" font-size="9.5" fill="#555555">organisation</text>
  <text x="87" y="288" text-anchor="middle" font-size="8" fill="#999999" font-style="italic">data already on file</text>

  <!-- ============================================================ -->
  <!-- PATH 1: build the document directly -->
  <!-- ============================================================ -->
  <text x="185" y="62" font-size="11" font-weight="bold" fill="#2B5081">Path 1 · Build the FHIR Document in the EHR</text>

  <line x1="155" y1="107" x2="180" y2="107" stroke="#2B5081" stroke-width="2" marker-end="url(#arr-dark)"/>

  <rect x="185" y="72" width="270" height="70" rx="8" fill="#2B5081" filter="url(#sh)"/>
  <text x="320" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Map EHR data to the profiles</text>
  <line x1="200" y1="101" x2="440" y2="101" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="320" y="117" text-anchor="middle" font-size="9.5" fill="#E9EEF6">Implemented in the EHR, rule by rule per profile</text>
  <text x="320" y="133" text-anchor="middle" font-size="8" fill="#ffffff" font-style="italic">FHIR library, e.g. HAPI FHIR, Firely .NET SDK</text>

  <line x1="455" y1="107" x2="630" y2="107" stroke="#2B5081" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="542" y="100" text-anchor="middle" font-size="8.5" fill="#555555" font-style="italic">no form involved</text>

  <!-- ============================================================ -->
  <!-- PATH 2: questionnaire, pre-population, extraction -->
  <!-- ============================================================ -->
  <text x="185" y="180" font-size="11" font-weight="bold" fill="#3B73AA">Path 2 · Use the Questionnaire from this guide</text>

  <!-- EHR → step 1 (elbow) -->
  <polyline points="155,232 180,232" fill="none" stroke="#3B73AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Path 2 steps: render + pre-populate, complete, extract -->
  <rect x="185" y="192" width="125" height="80" rx="8" fill="#3B73AA" filter="url(#sh)"/>
  <text x="247.5" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Render &amp;</text>
  <text x="247.5" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">pre-populate</text>
  <line x1="197" y1="234" x2="298" y2="234" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="247.5" y="249" text-anchor="middle" font-size="9" fill="#E9EEF6">known data filled in</text>
  <text x="247.5" y="264" text-anchor="middle" font-size="8" fill="#ffffff" font-style="italic">$populate</text>
  <line x1="310" y1="232" x2="327" y2="232" stroke="#3B73AA" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="332" y="192" width="125" height="80" rx="8" fill="#3B73AA" filter="url(#sh)"/>
  <text x="394.5" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Clinician</text>
  <text x="394.5" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">completes</text>
  <line x1="344" y1="234" x2="445" y2="234" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="394.5" y="249" text-anchor="middle" font-size="9" fill="#E9EEF6">only the open questions</text>
  <text x="394.5" y="264" text-anchor="middle" font-size="8" fill="#ffffff" font-style="italic">QuestionnaireResponse</text>
  <line x1="457" y1="232" x2="474" y2="232" stroke="#3B73AA" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="479" y="192" width="125" height="80" rx="8" fill="#2B5081" filter="url(#sh)"/>
  <text x="541.5" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Extract</text>
  <text x="541.5" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">document</text>
  <line x1="491" y1="234" x2="592" y2="234" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="541.5" y="249" text-anchor="middle" font-size="9" fill="#E9EEF6">template fills Bundle</text>
  <text x="541.5" y="264" text-anchor="middle" font-size="8" fill="#ffffff" font-style="italic">$extract</text>
  <line x1="604" y1="232" x2="630" y2="232" stroke="#3B73AA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- RESULT: FHIR Document -->
  <!-- ============================================================ -->
  <rect x="635" y="72" width="130" height="230" rx="8" fill="#E9EEF6" stroke="#3B73AA" stroke-width="1.5" filter="url(#sh)"/>
  <text x="700" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#3B73AA">FHIR Document</text>
  <text x="700" y="111" text-anchor="middle" font-size="8.5" fill="#555555">Bundle, type document</text>
  <rect x="648" y="124" width="104" height="18" rx="3" fill="#3B73AA"/>
  <text x="700" y="136" text-anchor="middle" font-size="8.5" fill="#ffffff">Composition</text>
  <rect x="648" y="146" width="104" height="18" rx="3" fill="#3B73AA"/>
  <text x="700" y="158" text-anchor="middle" font-size="8.5" fill="#ffffff">Patient</text>
  <rect x="648" y="168" width="104" height="18" rx="3" fill="#3B73AA"/>
  <text x="700" y="180" text-anchor="middle" font-size="8.5" fill="#ffffff">Condition</text>
  <rect x="648" y="190" width="104" height="18" rx="3" fill="#3B73AA"/>
  <text x="700" y="202" text-anchor="middle" font-size="8.5" fill="#ffffff">Observation, …</text>
  <rect x="648" y="212" width="104" height="18" rx="3" fill="#3B73AA"/>
  <text x="700" y="224" text-anchor="middle" font-size="8.5" fill="#ffffff">PractitionerRole, …</text>
  <text x="700" y="252" text-anchor="middle" font-size="8.5" fill="#555555">the same document</text>
  <text x="700" y="265" text-anchor="middle" font-size="8.5" fill="#555555">on both paths</text>

  <!-- Document → FOPH -->
  <line x1="765" y1="187" x2="790" y2="187" stroke="#3B73AA" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="795" y="142" width="90" height="90" rx="8" fill="#2B5081" filter="url(#sh)"/>
  <text x="840" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">FOPH</text>
  <line x1="805" y1="178" x2="875" y2="178" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="840" y="194" text-anchor="middle" font-size="9" fill="#E9EEF6">validate</text>
  <text x="840" y="208" text-anchor="middle" font-size="9" fill="#E9EEF6">&amp; receive</text>
  <text x="840" y="223" text-anchor="middle" font-size="8" fill="#ffffff" font-style="italic">FHIR API</text>

  <!-- ============================================================ -->
  <!-- BOTTOM: what this implementation guide provides -->
  <!-- ============================================================ -->
  <rect x="185" y="330" width="580" height="80" rx="8" fill="#F1F4F9" stroke="#2B5081" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="349" font-size="11" font-weight="bold" fill="#2B5081">CH EKM Implementation Guide</text>

  <rect x="200" y="358" width="425" height="42" rx="5" fill="#ffffff" stroke="#B9C8E1" stroke-width="1"/>
  <text x="412" y="374" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3B73AA">Questionnaire per disease (SDC)</text>
  <text x="412" y="390" text-anchor="middle" font-size="8.5" fill="#555555">questions and code lists · pre-population rules · extraction template</text>

  <rect x="640" y="358" width="112" height="42" rx="5" fill="#ffffff" stroke="#B9C8E1" stroke-width="1"/>
  <text x="696" y="374" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#3B73AA">Profiles</text>
  <text x="696" y="390" text-anchor="middle" font-size="8.5" fill="#555555">per disease</text>

  <!-- IG → path 2 (form definition) -->
  <line x1="394.5" y1="358" x2="394.5" y2="277" stroke="#7392C3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>
  <text x="400" y="318" font-size="8" fill="#7392C3" font-style="italic">defines the form</text>
  <!-- IG → document (rules) -->
  <line x1="696" y1="358" x2="696" y2="307" stroke="#7392C3" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>
  <text x="702" y="320" font-size="8" fill="#7392C3" font-style="italic">constrain</text>

  <!-- Legend -->
  <text x="450" y="440" text-anchor="middle" font-size="9" fill="#555555">Path 1 implements the profile rules in the EHR · Path 2 gets them from the Questionnaire · both are validated against the same profiles</text>
</svg>
